spring:
  application:
    name: landing-service
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8071
  servlet:
    context-path: /landing

logging:
  level:
    root: INFO
    org.springframework.jdbc.core: INFO